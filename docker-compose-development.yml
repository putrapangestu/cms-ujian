version: "3.9"

services:
  cms-ujian:
    image: registry.hummatech.com/proyek/ujian-cnps/cms-ujian:latest
    container_name: cms-ujian
    restart: unless-stopped
    mem_limit: "2g"
    cpus: "1.5"
    pids_limit: 512
    command: bun run preview
    ports:
      - "3003:3000"
    volumes:
      - asset_ujian:/app/dist/client

  nginx:
    image: nginx:alpine
    container_name: ujian-nginx
    mem_limit: "256m"
    cpus: "0.5"
    pids_limit: 256
    ports:
      - "8025:80"
    volumes:
      - asset_ujian:/app/dist/client:ro
      - ./nginx:/etc/nginx/conf.d
    depends_on:
      - cms-ujian

volumes:
  asset_ujian:
  db_data:
